  <style>
    * {

    /* Fundalul cu blur fin */

    /* Buton ENTER cu efect de apă (Liquid Fill) */

  <!-- Script Urmărire Cursor -->
  <script>
    const cursor = document.getElementById('custom-cursor');

    });

  <!-- Script Desenare pe Ecran (Linii Alb-Lucioase cu Aură care dispar) -->
  <script>
    const dCanvas = document.getElementById('drawing-canvas');
    const dCtx = dCanvas.getContext('2d');

    function resizeDCanvas() {
      dCanvas.width = window.innerWidth;
      dCanvas.height = window.innerHeight;
    }
    resizeDCanvas();
    window.addEventListener('resize', resizeDCanvas);

    let isMouseDown = false;
    let strokePoints = [];

    window.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      addPoint(e.clientX, e.clientY, true);
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (isMouseDown) {
        addPoint(e.clientX, e.clientY, false);
      }
    });

    function addPoint(x, y, isNewStroke) {
      strokePoints.push({ x: x, y: y, life: 1.0, isNew: isNewStroke });
    }

    function renderDrawings() {
      dCtx.clearRect(0, 0, dCanvas.width, dCanvas.height);

      for (let i = 0; i < strokePoints.length; i++) {
        strokePoints[i].life -= 0.012;
      }
      strokePoints = strokePoints.filter(p => p.life > 0);

      if (strokePoints.length > 1) {
        for (let i = 1; i < strokePoints.length; i++) {
          const p1 = strokePoints[i - 1];
          const p2 = strokePoints[i];
          if (p2.isNew) continue;

          const currentAlpha = Math.min(p1.life, p2.life);

          dCtx.save();
          dCtx.beginPath();
          dCtx.moveTo(p1.x, p1.y);
          dCtx.lineTo(p2.x, p2.y);
          dCtx.lineCap = 'round';
          dCtx.lineJoin = 'round';
          dCtx.lineWidth = 4;
          dCtx.strokeStyle = `rgba(255, 255, 255, ${currentAlpha})`;
          dCtx.shadowColor = `rgba(255, 255, 255, ${currentAlpha * 0.9})`;
          dCtx.shadowBlur = 14;
          dCtx.stroke();
          dCtx.restore();
        }
      }

      requestAnimationFrame(renderDrawings);
    }
    renderDrawings();
  </script>

  <!-- Animație Particule Stele din Nume -->
  <script>
    const pCanvas = document.getElementById('particles-canvas');
    const pCtx = pCanvas.getContext('2d');

    function resizePCanvas() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    resizePCanvas();
    window.addEventListener('resize', resizePCanvas);

    const particles = [];
    const usernameEl = document.getElementById('username-el');

    function drawStarShape(ctx, cx, cy, spikes, outerRadius, innerRadius, alpha) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      let step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function createParticle() {
      const rect = usernameEl.getBoundingClientRect();
      const randomX = rect.left + Math.random() * rect.width;
      const randomY = rect.top + Math.random() * rect.height;

      particles.push({
        x: randomX,
        y: randomY,
        vx: (Math.random() - 0.5) * 0.8,
        vy: -Math.random() * 1.2 - 0.4,
        size: Math.random() * 3 + 2,
        alpha: 1,
        decay: Math.random() * 0.015 + 0.008
      });
    }

    function animateParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

      if (Math.random() < 0.4) {
        createParticle();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          drawStarShape(pCtx, p.x, p.y, 4, p.size, p.size / 2, p.alpha);
        }
      }

      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>

  <!-- YouTube Audio API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let isPlaying = false;
    let updateTimer;
    const startTime = 43;

    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const seekSlider = document.getElementById('seek-slider');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeIcon = document.getElementById('volume-icon');
    const muteBtn = document.getElementById('mute-btn');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const welcomeOverlay = document.getElementById('welcome-overlay');
    const enterBtn = document.getElementById('enter-btn');

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'r08vc8i4dEo',
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1,
          'enablejsapi': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      player.setVolume(100);
      updateDuration();

      enterBtn.addEventListener('click', () => {
        welcomeOverlay.style.opacity = '0';
        welcomeOverlay.style.visibility = 'hidden';

        player.seekTo(startTime, true);
        player.playVideo();
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.className = 'fas fa-pause';
        playIcon.style.marginLeft = '0px';
        startTimer();
      } else {
        isPlaying = false;
        playIcon.className = 'fas fa-play';
        playIcon.style.marginLeft = '2px';
        stopTimer();
      }
    }

    playBtn.addEventListener('click', () => {
      if (!player || typeof player.getPlayerState !== 'function') return;
      
      if (isPlaying) {
        player.pauseVideo();
      } else {
        if (player.getCurrentTime() < startTime) {
          player.seekTo(startTime, true);
        }
        player.playVideo();
      }
    });

    seekSlider.addEventListener('input', () => {
      if (!player || !player.getDuration) return;
      const totalDuration = player.getDuration() - startTime;
      const seekToTime = startTime + (seekSlider.value / 100) * totalDuration;
      player.seekTo(seekToTime, true);
    });

    volumeSlider.addEventListener('input', () => {
      if (!player || !player.setVolume) return;
      const vol = volumeSlider.value;
      player.setVolume(vol);
      updateVolumeIcon(vol);
    });

    muteBtn.addEventListener('click', () => {
      if (!player) return;
      if (player.isMuted()) {
        player.unMute();
        updateVolumeIcon(volumeSlider.value);
      } else {
        player.mute();
        volumeIcon.className = 'fas fa-volume-xmark';
      }
    });

    function updateVolumeIcon(vol) {
      if (vol == 0) {
        volumeIcon.className = 'fas fa-volume-xmark';
      } else if (vol < 50) {
        volumeIcon.className = 'fas fa-volume-low';
      } else {
        volumeIcon.className = 'fas fa-volume-high';
      }
    }

    function startTimer() {
      stopTimer();
      updateTimer = setInterval(updateProgress, 500);
    }

    function stopTimer() {
      clearInterval(updateTimer);
    }

    function updateProgress() {
      if (!player || !player.getCurrentTime) return;
      const currentRealTime = player.getCurrentTime();
      const totalDuration = player.getDuration() - startTime;
      
      let visualCurrent = currentRealTime - startTime;
      if (visualCurrent < 0) visualCurrent = 0;

      if (totalDuration > 0) {
        seekSlider.value = (visualCurrent / totalDuration) * 100;
        currentTimeEl.textContent = formatTime(visualCurrent);
        durationEl.textContent = formatTime(totalDuration);
      }
    }

    function updateDuration() {
      if (player && player.getDuration) {
        const totalDuration = player.getDuration() - startTime;
        durationEl.textContent = formatTime(totalDuration);
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
  </script>
