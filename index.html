
<script>
const space = document.getElementById("space");

if (space) {
  for (let i = 0; i < 180; i++) {
    const star = document.createElement("span");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.setProperty("--speed", (2 + Math.random() * 5) + "s");
    star.style.animationDelay = (-Math.random() * 5) + "s";
    space.appendChild(star);
  }
}

const audio = document.getElementById("audio");
const play = document.getElementById("play");
const seek = document.getElementById("seek");
const vol = document.getElementById("vol");
const status = document.getElementById("status");
const current = document.getElementById("current");
const duration = document.getElementById("duration");
const volText = document.getElementById("volText");

function formatTime(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return minutes + ":" + String(secs).padStart(2, "0");
}

// Volumul inițial
audio.volume = vol ? Number(vol.value) : 0.7;

// Redare și pauză
play.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
    } catch (error) {
      status.textContent =
        "Nu s-a putut porni muzica. Verifică fișierul rava.mp3.";
    }
  } else {
    audio.pause();
  }
});

// Actualizare buton
audio.addEventListener("play", () => {
  play.textContent = "Ⅱ";
  play.setAttribute("aria-label", "Pauză");
  if (status) status.textContent = "Se redă acum: RAVA";
});

audio.addEventListener("pause", () => {
  play.textContent = "▶";
  play.setAttribute("aria-label", "Redare");
});

// Durata melodiei
audio.addEventListener("loadedmetadata", () => {
  if (duration) duration.textContent = formatTime(audio.duration);
  if (status) status.textContent = "RAVA - $brotherz$ (Official Video)";
});

// Progresul melodiei
audio.addEventListener("timeupdate", () => {
  if (current) current.textContent = formatTime(audio.currentTime);

  if (seek && Number.isFinite(audio.duration) && audio.duration > 0) {
    seek.value = (audio.currentTime / audio.duration) * 100;
  }
});

// Derulare
seek.addEventListener("input", () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = (Number(seek.value) / 100) * audio.duration;
  }
});

// Volum
vol.addEventListener("input", () => {
  audio.volume = Number(vol.value);
  if (volText) {
    volText.textContent = Math.round(audio.volume * 100) + "%";
  }
});

// Melodia s-a terminat
audio.addEventListener("ended", () => {
  play.textContent = "▶";
  if (seek) seek.value = 0;
});

// Eroare la încărcarea fișierului
audio.addEventListener("error", () => {
  if (status) {
    status.textContent =
      "Nu găsesc rava.mp3. Încarcă fișierul lângă index.html pe GitHub.";
  }
});

// Încearcă redarea automată.
// Browserul poate bloca pornirea automată cu sunet.
audio.play().catch(() => {
  if (status) {
    status.textContent = "Apasă Play pentru a porni muzica.";
  }
});
</script>
