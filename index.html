  <!-- Animație Spațială Alb-Negru -->
  <script>
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const stars = [];
    for (let i = 0; i < 180; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.5 + 0.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005
      });
    }

    const planets = [
      { x: canvas.width * 0.15, y: canvas.height * 0.2, radius: 28, color: '#222222', strokeColor: '#ffffff', glow: '#ffffff', angle: 0, speed: 0.002, orbitRadius: 15 },
      { x: canvas.width * 0.85, y: canvas.height * 0.75, radius: 38, color: '#111111', strokeColor: '#cccccc', glow: '#aaaaaa', ring: true, angle: Math.PI, speed: 0.0015, orbitRadius: 20 }
    ];

    function drawSpace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      planets.forEach(p => {
        p.angle += p.speed;
        const currentX = p.x + Math.cos(p.angle) * p.orbitRadius;
        const currentY = p.y + Math.sin(p.angle) * p.orbitRadius;

        ctx.beginPath();
        ctx.arc(currentX, currentY, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = p.strokeColor;
        ctx.lineWidth = 1.5;
        ctx.shadowColor = p.glow;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        if (p.ring) {
          ctx.beginPath();
          ctx.ellipse(currentX, currentY, p.radius * 1.9, p.radius * 0.45, Math.PI / 6, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }
      });

      requestAnimationFrame(drawSpace);
    }
    drawSpace();
  </script>

  <!-- YouTube IFrame API & Logica de Autoplay -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let isPlaying = false;
    let updateTimer;

    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const seekSlider = document.getElementById('seek-slider');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeIcon = document.getElementById('volume-icon');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const welcomeOverlay = document.getElementById('welcome-overlay');

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'htCnJYPEu8Q',
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1,
          'enablejsapi': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      player.setVolume(100);
      updateDuration();

      // Când utilizatorul dă click pe ecranul de întâmpinare
      welcomeOverlay.addEventListener('click', () => {
        welcomeOverlay.style.opacity = '0';
        setTimeout(() => {
          welcomeOverlay.style.display = 'none';
        }, 500);

        // Pornește melodia instant la volum maxim
        player.playVideo();
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.className = 'fas fa-pause';
        playIcon.style.marginLeft = '0px';
        startTimer();
      } else {
        isPlaying = false;
        playIcon.className = 'fas fa-play';
        playIcon.style.marginLeft = '3px';
        stopTimer();
      }
    }

    playBtn.addEventListener('click', () => {
      if (!player || typeof player.getPlayerState !== 'function') return;
      
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    seekSlider.addEventListener('input', () => {
      if (!player || !player.getDuration) return;
      const duration = player.getDuration();
      const seekTo = (seekSlider.value / 100) * duration;
      player.seekTo(seekTo, true);
    });

    // Control volum
    volumeSlider.addEventListener('input', () => {
      if (!player || !player.setVolume) return;
      const vol = volumeSlider.value;
      player.setVolume(vol);

      if (vol == 0) {
        volumeIcon.className = 'fas fa-volume-xmark volume-icon';
      } else if (vol < 50) {
        volumeIcon.className = 'fas fa-volume-low volume-icon';
      } else {
        volumeIcon.className = 'fas fa-volume-high volume-icon';
      }
    });

    function startTimer() {
      stopTimer();
      updateTimer = setInterval(updateProgress, 500);
    }

    function stopTimer() {
      clearInterval(updateTimer);
    }

    function updateProgress() {
      if (!player || !player.getCurrentTime) return;
      const current = player.getCurrentTime();
      const duration = player.getDuration();

      if (duration > 0) {
        seekSlider.value = (current / duration) * 100;
        currentTimeEl.textContent = formatTime(current);
        durationEl.textContent = formatTime(duration);
      }
    }

    function updateDuration() {
      if (player && player.getDuration) {
        durationEl.textContent = formatTime(player.getDuration());
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
  </script>
