<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@snuxjx0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: #050508;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Background cu efect spațial */
    .stars-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      z-index: 1;
    }

    /* Containerul principal pe mijlocul ecranului */
    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      padding: 20px;
    }

    /* Secțiunea de profil cu numele și butoanele sociale */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .username {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }

    .social-links {
      display: flex;
      gap: 15px;
    }

    .social-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      text-decoration: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    }

    /* Cardul player-ului audio */
    .player-card {
      width: 320px;
      background: rgba(18, 18, 24, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .track-info {
      text-align: center;
      width: 100%;
    }

    .track-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.85rem;
      color: #a0a0a0;
      font-weight: 500;
    }

    /* Controalele audio */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 5px;
    }

    .play-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    /* Bara de progres și minutarul */
    .progress-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #808080;
      font-family: monospace;
    }

    .seek-slider {
      width: 100%;
      height: 5px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      outline: none;
      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    /* Pozitioneaza YouTube IFrame-ul in afara ecranului fara sa-l dezactiveze */
    #yt-player-hidden {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="stars-bg"></div>

  <!-- Player-ul YouTube ascuns -->
  <div id="yt-player-hidden">
    <div id="player"></div>
  </div>

  <div class="main-container">
    
    <!-- Header cu profil și rețele sociale -->
    <div class="profile-section">
      <h1 class="username">@snuxjx0</h1>
      <div class="social-links">
        <a href="https://www.tiktok.com/@snuxjx0" target="_blank" class="social-btn" title="TikTok">
          <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://steamcommunity.com/profiles/76561199860743512/" target="_blank" class="social-btn" title="Steam">
          <i class="fab fa-steam"></i>
        </a>
        <a href="https://www.youtube.com/@snuxjx0" target="_blank" class="social-btn" title="YouTube">
          <i class="fab fa-youtube"></i>
        </a>
      </div>
    </div>

    <!-- Cardul cu controale pentru muzică -->
    <div class="player-card">
      <div class="track-info">
        <div class="track-title">$brotherz$</div>
        <div class="track-artist">RAVA</div>
      </div>

      <div class="controls">
        <button class="play-btn" id="play-btn">
          <i class="fas fa-play" id="play-icon" style="margin-left: 3px;"></i>
        </button>
      </div>

      <div class="progress-container">
        <input type="range" class="seek-slider" id="seek-slider" value="0" min="0" max="100" step="0.1">
        <div class="time-display">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Script YouTube API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let isPlaying = false;
    let updateTimer;

    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const seekSlider = document.getElementById('seek-slider');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');

    // Se apelează automat când API-ul YouTube s-a încărcat
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '200',
        width: '200',
        videoId: 'htCnJYPEu8Q',
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      player.setVolume(100);
      updateDuration();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.className = 'fas fa-pause';
        playIcon.style.marginLeft = '0px';
        startTimer();
      } else {
        isPlaying = false;
        playIcon.className = 'fas fa-play';
        playIcon.style.marginLeft = '3px';
        stopTimer();
      }
    }

    // Comutator Start / Stop
    playBtn.addEventListener('click', () => {
      if (!player || typeof player.getPlayerState !== 'function') return;
      
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    // Derulare melodie (Seeking)
    seekSlider.addEventListener('input', () => {
      if (!player || !player.getDuration) return;
      const duration = player.getDuration();
      const seekTo = (seekSlider.value / 100) * duration;
      player.seekTo(seekTo, true);
    });

    function startTimer() {
      stopTimer();
      updateTimer = setInterval(updateProgress, 500);
    }

    function stopTimer() {
      clearInterval(updateTimer);
    }

    function updateProgress() {
      if (!player || !player.getCurrentTime) return;
      const current = player.getCurrentTime();
      const duration = player.getDuration();

      if (duration > 0) {
        seekSlider.value = (current / duration) * 100;
        currentTimeEl.textContent = formatTime(current);
        durationEl.textContent = formatTime(duration);
      }
    }

    function updateDuration() {
      if (player && player.getDuration) {
        durationEl.textContent = formatTime(player.getDuration());
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
  </script>
</body>
</html>
