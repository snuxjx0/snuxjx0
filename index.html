
<script>
const space = document.getElementById("space");

for (let i = 0; i < 180; i++) {
  const star = document.createElement("span");
  star.className = "star";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.setProperty("--speed", (2 + Math.random() * 5) + "s");
  star.style.animationDelay = (-Math.random() * 5) + "s";
  space.appendChild(star);
}

const audio = document.getElementById("audio");
const play = document.getElementById("play");
const seek = document.getElementById("seek");
const vol = document.getElementById("vol");
const status = document.getElementById("status");

audio.volume = 0.7;

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  return Math.floor(seconds / 60) + ":" +
    String(Math.floor(seconds % 60)).padStart(2, "0");
}

play.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
    } catch {
      status.textContent = "Verifică fișierul rava.mp3.";
    }
  } else {
    audio.pause();
  }
});

audio.addEventListener("play", () => {
  play.textContent = "Ⅱ";
  status.textContent = "Se redă acum.";
});

audio.addEventListener("pause", () => {
  play.textContent = "▶";
});

audio.addEventListener("loadedmetadata", () => {
  document.getElementById("duration").textContent =
    formatTime(audio.duration);
  status.textContent = "RAVA - $brotherz$";
});

audio.addEventListener("timeupdate", () => {
  document.getElementById("current").textContent =
    formatTime(audio.currentTime);

  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    seek.value = audio.currentTime / audio.duration * 100;
  }
});

seek.addEventListener("input", () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = Number(seek.value) / 100 * audio.duration;
  }
});

vol.addEventListener("input", () => {
  audio.volume = Number(vol.value);
  document.getElementById("volText").textContent =
    Math.round(audio.volume * 100) + "%";
});

audio.addEventListener("error", () => {
  status.textContent = "Încarcă fișierul audio rava.mp3 în repository.";
});
</script>
