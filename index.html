<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: #050508;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Canvas Spațial (Stele + Planete) */
    #space-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Canvas Particule Nume */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: none;
    }

    /* Overlay Ecran de Start */
    #welcome-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .welcome-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
    }

    /* Buton ENTER cu efect de apă (Liquid Wave Fill) */
    .liquid-btn {
      position: relative;
      padding: 14px 45px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      background: transparent;
      border: 2px solid #ffffff;
      border-radius: 40px;
      cursor: pointer;
      overflow: hidden;
      transition: color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    /* Valul de apă din interiorul butonului */
    .liquid-btn::before {
      content: '';
      position: absolute;
      top: 100%;
      left: -20%;
      width: 140%;
      height: 200%;
      background: #ffffff;
      border-radius: 40%;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: -1;
    }

    .liquid-btn:hover {
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.8);
    }

    .liquid-btn:hover::before {
      top: -40%;
      transform: rotate(180deg);
    }

    /* Container Principal Profil + Player */
    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
      padding: 20px;
      width: 100%;
      max-width: 460px;
    }

    /* Header Profil */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      position: relative;
    }

    .username {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 50px rgba(255, 255, 255, 0.4);
      position: relative;
      display: inline-block;
    }

    .social-links {
      display: flex;
      gap: 15px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.15rem;
      text-decoration: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
    }

    /* Card Player Audio Stilizat */
    .player-card {
      width: 100%;
      background: rgba(12, 12, 14, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 22px 26px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .track-info {
      text-align: center;
      width: 100%;
    }

    .track-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .progress-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .seek-slider {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
    }

    .time-indicators {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #aaaaaa;
      font-family: monospace;
    }

    .media-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding-top: 4px;
    }

    .control-sub-btn {
      background: none;
      border: none;
      color: #aaaaaa;
      font-size: 1rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .control-sub-btn:hover {

    }

    .center-group {
      display: flex;
      align-items: center;
      gap: 20px;

    .play-btn-main {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.1rem;
      transition: all 0.2s ease;

    }

    .play-btn-main:hover {

      box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
    }

    .volume-box-inline {

    .volume-slider {

      -webkit-appearance: none;

    }

    #hidden-yt-container {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;

  <!-- Script Animație Spațială: Stele + Planete Roto-Dinamice -->
  <script>
    const spaceCanvas = document.getElementById('space-canvas');
    const sCtx = spaceCanvas.getContext('2d');

    function resizeSpaceCanvas() {
      spaceCanvas.width = window.innerWidth;
      spaceCanvas.height = window.innerHeight;
    }
    resizeSpaceCanvas();
    window.addEventListener('resize', resizeSpaceCanvas);

    const bgStars = [];
    for (let i = 0; i < 200; i++) {
      bgStars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 1.5 + 0.5,
        alpha: Math.random(),
        speed: Math.random() * 0.012 + 0.004
      });
    }

    const planets = [
      {
        get x() { return spaceCanvas.width * 0.18; },
        get y() { return spaceCanvas.height * 0.22; },
        radius: 38,
        color: '#080808',
        strokeColor: '#ffffff',
        glowColor: 'rgba(255, 255, 255, 0.5)',
        ring: true,
        ringRadiusX: 70,
        ringRadiusY: 18,
        ringAngle: -Math.PI / 6,
        angle: 0,
        speed: 0.0018,
        orbitRadius: 22
      },
      {
        get x() { return spaceCanvas.width * 0.82; },
        get y() { return spaceCanvas.height * 0.78; },
        radius: 52,
        color: '#0c0c0c',
        strokeColor: '#dddddd',
        glowColor: 'rgba(220, 220, 220, 0.35)',
        ring: true,
        doubleRing: true,
        ringRadiusX: 105,
        ringRadiusY: 24,
        ringAngle: Math.PI / 5,
        angle: Math.PI,
        speed: 0.001,
        orbitRadius: 28
      }
    ];

    function drawSpace() {
      sCtx.clearRect(0, 0, spaceCanvas.width, spaceCanvas.height);

      // Stele Fundal
      bgStars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
        sCtx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
        sCtx.beginPath();
        sCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        sCtx.fill();
      });

      // Planete
      planets.forEach(p => {
        p.angle += p.speed;
        const cx = p.x + Math.cos(p.angle) * p.orbitRadius;
        const cy = p.y + Math.sin(p.angle) * p.orbitRadius;

        sCtx.save();
        sCtx.beginPath();
        sCtx.arc(cx, cy, p.radius, 0, Math.PI * 2);
        sCtx.fillStyle = p.color;
        sCtx.strokeStyle = p.strokeColor;
        sCtx.lineWidth = 2;
        sCtx.shadowColor = p.glowColor;
        sCtx.shadowBlur = 18;
        sCtx.fill();
        sCtx.stroke();
        sCtx.restore();

        if (p.ring) {
          sCtx.save();
          sCtx.translate(cx, cy);
          sCtx.rotate(p.ringAngle);

          sCtx.beginPath();
          sCtx.ellipse(0, 0, p.ringRadiusX, p.ringRadiusY, 0, 0, Math.PI * 2);
          sCtx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
          sCtx.lineWidth = 2;
          sCtx.stroke();

          if (p.doubleRing) {
            sCtx.beginPath();
            sCtx.ellipse(0, 0, p.ringRadiusX + 12, p.ringRadiusY + 4, 0, 0, Math.PI * 2);
            sCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            sCtx.lineWidth = 1;
            sCtx.stroke();
          }

          sCtx.restore();
        }
      });

      requestAnimationFrame(drawSpace);
    }
    drawSpace();
  </script>

  <!-- Script Particule Nume (Stele) -->
  <script>
    const pCanvas = document.getElementById('particles-canvas');
    const pCtx = pCanvas.getContext('2d');

    function resizePCanvas() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    resizePCanvas();
    window.addEventListener('resize', resizePCanvas);

    const particles = [];
    const usernameEl = document.getElementById('username-el');

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, alpha) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      let step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function createParticle() {
      const rect = usernameEl.getBoundingClientRect();
      const randomX = rect.left + Math.random() * rect.width;
      const randomY = rect.top + Math.random() * rect.height;

      particles.push({
        x: randomX,
        y: randomY,
        vx: (Math.random() - 0.5) * 0.8,
        vy: -Math.random() * 1.2 - 0.4,
        size: Math.random() * 3 + 2,
        alpha: 1,
        decay: Math.random() * 0.015 + 0.008
      });
    }

    function animateParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

      if (Math.random() < 0.4) {
        createParticle();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          drawStar(pCtx, p.x, p.y, 4, p.size, p.size / 2, p.alpha);
        }
      }

      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>

  <!-- YouTube API & Logică Audio -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let isPlaying = false;
    let updateTimer;
    const startTime = 43;

    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const seekSlider = document.getElementById('seek-slider');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeIcon = document.getElementById('volume-icon');
    const muteBtn = document.getElementById('mute-btn');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const welcomeOverlay = document.getElementById('welcome-overlay');
    const enterBtn = document.getElementById('enter-btn');

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'r08vc8i4dEo',
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1,
          'enablejsapi': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      player.setVolume(100);
      updateDurationDisplay();

      // Apăsare Buton ENTER -> Intrarea directă pe site și pornire muzică
      enterBtn.addEventListener('click', () => {
        welcomeOverlay.style.opacity = '0';
        welcomeOverlay.style.visibility = 'hidden';

        player.seekTo(startTime, true);
        player.playVideo();
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.className = 'fas fa-pause';
        playIcon.style.marginLeft = '0px';
        startTimer();
      } else {
        isPlaying = false;
        playIcon.className = 'fas fa-play';
        playIcon.style.marginLeft = '2px';
        stopTimer();
      }
    }

    playBtn.addEventListener('click', () => {
      if (!player || typeof player.getPlayerState !== 'function') return;
      
      if (isPlaying) {
        player.pauseVideo();
      } else {
        if (player.getCurrentTime() < startTime) {
          player.seekTo(startTime, true);
        }
        player.playVideo();
      }
    });

    seekSlider.addEventListener('input', () => {
      if (!player || !player.getDuration) return;
      const totalAudioDuration = player.getDuration();
      const availableVisualDuration = totalAudioDuration - startTime;
      
      const targetRealTime = startTime + (seekSlider.value / 100) * availableVisualDuration;
      player.seekTo(targetRealTime, true);
    });

    volumeSlider.addEventListener('input', () => {
      if (!player || !player.setVolume) return;
      const vol = volumeSlider.value;
      player.setVolume(vol);
      updateVolumeIcon(vol);
    });

    muteBtn.addEventListener('click', () => {
      if (!player) return;
      if (player.isMuted()) {
        player.unMute();
        updateVolumeIcon(volumeSlider.value);
      } else {
        player.mute();
        volumeIcon.className = 'fas fa-volume-xmark';
      }
    });

    function updateVolumeIcon(vol) {
      if (vol == 0) {
        volumeIcon.className = 'fas fa-volume-xmark';
      } else if (vol < 50) {
        volumeIcon.className = 'fas fa-volume-low';
      } else {
        volumeIcon.className = 'fas fa-volume-high';
      }
    }

    function startTimer() {
      stopTimer();
      updateTimer = setInterval(updateProgress, 500);
    }

    function stopTimer() {
      clearInterval(updateTimer);
    }

    function updateProgress() {
      if (!player || !player.getCurrentTime || !player.getDuration) return;
      const currentRealTime = player.getCurrentTime();
      const totalAudioDuration = player.getDuration();
      const availableVisualDuration = totalAudioDuration - startTime;

      let visualCurrent = currentRealTime - startTime;
      if (visualCurrent < 0) visualCurrent = 0;
      if (visualCurrent > availableVisualDuration) visualCurrent = availableVisualDuration;

      if (availableVisualDuration > 0) {
        seekSlider.value = (visualCurrent / availableVisualDuration) * 100;
        currentTimeEl.textContent = formatTime(visualCurrent);
      }
    }

    function updateDurationDisplay() {
      if (player && player.getDuration) {
        const totalAudioDuration = player.getDuration();
        const availableVisualDuration = totalAudioDuration - startTime;
        durationEl.textContent = formatTime(availableVisualDuration);
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
  </script>
