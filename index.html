
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030303">
<title>@snuxjx0 | My Space</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;min-height:100svh;
  background:#020203;color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  display:grid;place-items:center;
  overflow-x:hidden;padding:25px 16px
}
#space{
  position:fixed;inset:0;overflow:hidden;
  pointer-events:none;
  background:radial-gradient(ellipse at center,#111119 0%,#020203 72%)
}
.star{
  position:absolute;width:2px;height:2px;
  border-radius:50%;background:white;
  animation:twinkle var(--speed) ease-in-out infinite alternate
}
@keyframes twinkle{
  from{opacity:.1;transform:scale(.7)}
  to{opacity:.95;transform:scale(1.5)}
}
.planet{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#eee,#888 25%,#333 55%,#080808 80%);
  box-shadow:0 0 25px #fff2;
  animation:float 8s ease-in-out infinite
}
.p1{width:25px;height:25px;left:45%;top:20%}
.p2{width:48px;height:48px;left:9%;top:75%;animation-delay:-2s}
.p3{width:58px;height:58px;right:10%;top:12%;animation-delay:-4s}
.ring{
  position:absolute;width:90px;height:27px;
  border:2px solid #aaa9;border-radius:50%;
  left:50%;top:50%;
  transform:translate(-50%,-50%) rotate(-25deg)
}
@keyframes float{50%{translate:0 -15px}}
main{
  position:relative;width:min(440px,100%);
  animation:appear 1s ease
}
@keyframes appear{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}
.profile{
  display:flex;align-items:center;justify-content:center;
  gap:18px;margin-bottom:30px
}
.steam-avatar{
  width:82px;height:82px;flex-shrink:0;
  display:grid;place-items:center;
  border:1px solid #777;border-radius:50%;
  color:#fff;background:linear-gradient(145deg,#292929,#080808);
  text-decoration:none;
  box-shadow:0 0 25px #fff2;
  transition:.25s
}
.steam-avatar:hover{
  transform:scale(1.06);
  box-shadow:0 0 28px #8abaff55
}
.steam-avatar svg{width:48px;height:48px;fill:currentColor}
h1{font-size:29px;letter-spacing:-1px;margin:0 0 12px}
.socials{display:flex;gap:10px}
.social{
  width:38px;height:38px;display:grid;place-items:center;
  border:1px solid #444;border-radius:50%;
  color:white;background:#111;text-decoration:none;
  transition:.2s;font-size:17px
}
.social:hover{background:#333;transform:translateY(-3px)}
.social svg{width:19px;height:19px;fill:currentColor}
.player{
  border:1px solid #333;border-radius:19px;
  padding:16px;background:#0b0b0be8;
  backdrop-filter:blur(16px);
  box-shadow:0 12px 45px #0009
}
.track{display:flex;align-items:center;gap:12px}
.cover{
  width:48px;height:48px;flex-shrink:0;
  display:grid;place-items:center;border:1px solid #444;
  border-radius:9px;background:linear-gradient(145deg,#555,#090909);
  font-size:11px;font-weight:bold;letter-spacing:1px
}
.info{flex:1;min-width:0}
.title{font-size:14px;font-weight:bold;margin-bottom:5px}
.artist{font-size:10px;letter-spacing:1.5px;color:#888}
.badge{
  color:#aaa;border:1px solid #333;border-radius:5px;
  padding:5px 7px;font-size:9px;white-space:nowrap
}
.player-frame{
  width:100%;aspect-ratio:16/9;
  margin-top:15px;overflow:hidden;border-radius:10px;
  background:#000
}
.player-frame iframe{width:100%;height:100%;border:0}
.note{color:#888;font-size:11px;line-height:1.5;margin:12px 0 0}
.youtube-link{
  display:flex;align-items:center;justify-content:center;
  gap:8px;width:100%;margin-top:12px;padding:11px;
  border:1px solid #333;border-radius:10px;
  background:#151515;color:white;text-decoration:none;font-size:12px;
  transition:.2s
}
.youtube-link:hover{background:#292929}
.youtube-link svg{width:18px;height:18px;fill:#ff3333}
.footer{
  text-align:center;margin-top:22px;color:#666;
  font-size:10px;letter-spacing:3px
}
@media(max-width:380px){
  .profile{gap:12px}
  .steam-avatar{width:68px;height:68px}
  .steam-avatar svg{width:40px;height:40px}
  h1{font-size:25px}
  .player{padding:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important
  }
}
</style>
</head>

<body>

</main>

<script>
const space=document.getElementById("space");
for(let i=0;i<180;i++){
  const star=document.createElement("span");
  star.className="star";
  star.style.left=Math.random()*100+"%";
  star.style.top=Math.random()*100+"%";
  star.style.setProperty("--speed",(2+Math.random()*5)+"s");
  star.style.animationDelay=(-Math.random()*5)+"s";
  space.appendChild(star);
}
</script>
</body>
</html>
