<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@snuxjx0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Canvas pentru stele și planete alb-negru */
    #space-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Containerul principal pe mijlocul ecranului */
    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      padding: 20px;
      max-width: 380px;
      width: 90%;
    }

    /* Header Profil */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .username {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
    }

    .social-links {
      display: flex;
      gap: 15px;
    }

    .social-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      text-decoration: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
    }

    /* Card Player Audio Personalizat */
    .player-card {
      width: 100%;
      background: rgba(12, 12, 12, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .track-info {
      text-align: center;
      width: 100%;
    }

    .track-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .track-artist {
      font-size: 0.85rem;
      color: #aaaaaa;
      font-weight: 500;
    }

    /* Controale */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .play-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }

    /* Bară de progres */
    .progress-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #a0a0a0;
      font-family: monospace;
    }

    .seek-slider {
      width: 100%;
      height: 5px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      outline: none;
      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <!-- Fundalul alb-negru cu stele și planete -->
  <canvas id="space-canvas"></canvas>

  <!-- Player Audio Direct (Poți schimba src-ul cu link-ul tău direct de fișier .mp3 dacă dorești) -->
  <audio id="audio-player" src="rava.mp3" preload="metadata" loop></audio>

  <div class="main-container">
    
    <!-- Profil Header -->
    <div class="profile-section">
      <h1 class="username">@snuxjx0</h1>
      <div class="social-links">
        <a href="https://www.tiktok.com/@snuxjx0" target="_blank" class="social-btn" title="TikTok">
          <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://steamcommunity.com/profiles/76561199860743512/" target="_blank" class="social-btn" title="Steam">
          <i class="fab fa-steam"></i>
        </a>
        <a href="https://www.youtube.com/@snuxjx0" target="_blank" class="social-btn" title="YouTube">
          <i class="fab fa-youtube"></i>
        </a>
      </div>
    </div>

    <!-- Card Player Audio -->
    <div class="player-card">
      <div class="track-info">
        <div class="track-title">$brotherz$</div>
        <div class="track-artist">RAVA</div>
      </div>

      <!-- Buton Start / Stop -->
      <div class="controls">
        <button class="play-btn" id="play-btn">
          <i class="fas fa-play" id="play-icon" style="margin-left: 3px;"></i>
        </button>
      </div>

      <!-- Bara de derulare și minutajul -->
      <div class="progress-container">
        <input type="range" class="seek-slider" id="seek-slider" value="0" min="0" max="100" step="0.1">
        <div class="time-display">
          <span id="current-time">0:00</span>
          <span id="duration">3:54</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Animație Spațială Alb-Negru -->
  <script>
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const stars = [];
    for (let i = 0; i < 180; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.5 + 0.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005
      });
    }

    const planets = [
      { x: canvas.width * 0.15, y: canvas.height * 0.2, radius: 28, color: '#222222', strokeColor: '#ffffff', glow: '#ffffff', angle: 0, speed: 0.002, orbitRadius: 15 },
      { x: canvas.width * 0.85, y: canvas.height * 0.75, radius: 38, color: '#111111', strokeColor: '#cccccc', glow: '#aaaaaa', ring: true, angle: Math.PI, speed: 0.0015, orbitRadius: 20 }
    ];

    function drawSpace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      planets.forEach(p => {
        p.angle += p.speed;
        const currentX = p.x + Math.cos(p.angle) * p.orbitRadius;
        const currentY = p.y + Math.sin(p.angle) * p.orbitRadius;

        ctx.beginPath();
        ctx.arc(currentX, currentY, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = p.strokeColor;
        ctx.lineWidth = 1.5;
        ctx.shadowColor = p.glow;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        if (p.ring) {
          ctx.beginPath();
          ctx.ellipse(currentX, currentY, p.radius * 1.9, p.radius * 0.45, Math.PI / 6, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }
      });

      requestAnimationFrame(drawSpace);
    }
    drawSpace();
  </script>

  <!-- Script Control Player Audio -->
  <script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const seekSlider = document.getElementById('seek-slider');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.className = 'fas fa-pause';
          playIcon.style.marginLeft = '0px';
        }).catch(err => {
          console.log("Play error: ", err);
        });
      } else {
        audio.pause();
        playIcon.className = 'fas fa-play';
        playIcon.style.marginLeft = '3px';
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const progress = (audio.currentTime / audio.duration) * 100;
        seekSlider.value = progress;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    seekSlider.addEventListener('input', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        audio.currentTime = (seekSlider.value / 100) * audio.duration;
      }
    });

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
  </script>
</body>
</html>
