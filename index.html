<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@snuxjx0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Canvas pentru stele și planete alb-negru */
    #space-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Containerul principal pe mijlocul ecranului */
    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
      max-width: 420px;
      width: 90%;
    }

    /* Header Profil */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .username {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
    }

    .social-links {
      display: flex;
      gap: 15px;
    }

    .social-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      text-decoration: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
    }

    /* Card Player */
    .player-card {
      width: 100%;
      background: rgba(12, 12, 12, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .track-info {
      text-align: center;
      width: 100%;
    }

    .track-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .track-artist {
      font-size: 0.9rem;
      color: #aaaaaa;
      font-weight: 500;
    }

    /* Player Container YouTube */
    .video-frame-container {
      width: 100%;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
    }

    .video-frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Controale */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .play-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }

    /* Bară de progres */
    .progress-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #a0a0a0;
      font-family: monospace;
    }

    .seek-slider {
      width: 100%;
      height: 5px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      outline: none;
      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <!-- Fundalul alb-negru cu stele și planete -->
  <canvas id="space-canvas"></canvas>

  <div class="main-container">
    
    <!-- Profil Header -->
    <div class="profile-section">
      <h1 class="username">@snuxjx0</h1>
      <div class="social-links">
        <a href="https://www.tiktok.com/@snuxjx0" target="_blank" class="social-btn" title="TikTok">
          <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://steamcommunity.com/profiles/76561199860743512/" target="_blank" class="social-btn" title="Steam">
          <i class="fab fa-steam"></i>
        </a>
        <a href="https://www.youtube.com/@snuxjx0" target="_blank" class="social-btn" title="YouTube">
          <i class="fab fa-youtube"></i>
        </a>
      </div>
    </div>

    <!-- Music Player -->
    <div class="player-card">
      <div class="track-info">
        <div class="track-title">RAVA - $brotherz$</div>
        <div class="track-artist">Official Music Video</div>
      </div>

      <!-- Player YouTube -->
      <div class="video-frame-container">
        <div id="player"></div>
      </div>

      <!-- Buton Start / Stop -->
      <div class="controls">
        <button class="play-btn" id="play-btn">
          <i class="fas fa-play" id="play-icon" style="margin-left: 2px;"></i>
        </button>
      </div>

      <!-- Bara de derulare și minutajul -->
      <div class="progress-container">
        <input type="range" class="seek-slider" id="seek-slider" value="0" min="0" max="100" step="0.1">
        <div class="time-display">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Script Animație Spațială Alb-Negru -->
  <script>
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Generare Stele
    const stars = [];
    for (let i = 0; i < 180; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.5 + 0.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005
      });
    }

    // Planete Alb-Negru
    const planets = [
      { x: canvas.width * 0.15, y: canvas.height * 0.2, radius: 28, color: '#222222', strokeColor: '#ffffff', glow: '#ffffff', angle: 0, speed: 0.002, orbitRadius: 15 },
      { x: canvas.width * 0.85, y: canvas.height * 0.75, radius: 38, color: '#111111', strokeColor: '#cccccc', glow: '#aaaaaa', ring: true, angle: Math.PI, speed: 0.0015, orbitRadius: 20 }
    ];

    function drawSpace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Desenează Stelele
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Desenează Planetele Alb-Negru
      planets.forEach(p => {
        p.angle += p.speed;
        const currentX = p.x + Math.cos(p.angle) * p.orbitRadius;
        const currentY = p.y + Math.sin(p.angle) * p.orbitRadius;

        // Corpul Planetei
        ctx.beginPath();
        ctx.arc(currentX, currentY, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = p.strokeColor;
        ctx.lineWidth = 1.5;
        ctx.shadowColor = p.glow;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Inelul Planetei (Alb-Negru)
        if (p.ring) {
          ctx.beginPath();
          ctx.ellipse(currentX, currentY, p.radius * 1.9, p.radius * 0.45, Math.PI / 6, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }
      });

      requestAnimationFrame(drawSpace);
    }
    drawSpace();
  </script>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let isPlaying = false;
    let updateTimer;

    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const seekSlider = document.getElementById('seek-slider');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'htCnJYPEu8Q',
        playerVars: {
          'autoplay': 0,
          'controls': 1,
          'modestbranding': 1,
          'rel': 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      updateDuration();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.className = 'fas fa-pause';
        playIcon.style.marginLeft = '0px';
        startTimer();
      } else {
        isPlaying = false;
        playIcon.className = 'fas fa-play';
        playIcon.style.marginLeft = '2px';
        stopTimer();
      }
    }

    playBtn.addEventListener('click', () => {
      if (!player || typeof player.getPlayerState !== 'function') return;
      
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    seekSlider.addEventListener('input', () => {
      if (!player || !player.getDuration) return;
      const duration = player.getDuration();
      const seekTo = (seekSlider.value / 100) * duration;
      player.seekTo(seekTo, true);
    });

    function startTimer() {
      stopTimer();
      updateTimer = setInterval(updateProgress, 500);
    }

    function stopTimer() {
      clearInterval(updateTimer);
    }

    function updateProgress() {
      if (!player || !player.getCurrentTime) return;
      const current = player.getCurrentTime();
      const duration = player.getDuration();

      if (duration > 0) {
        seekSlider.value = (current / duration) * 100;
        currentTimeEl.textContent = formatTime(current);
        durationEl.textContent = formatTime(duration);
      }
    }

    function updateDuration() {
      if (player && player.getDuration) {
        durationEl.textContent = formatTime(player.getDuration());
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
  </script>
</body>
</html>
